<rect x="790" y="50" width="500" height="600" fill="#fff" stroke="#333" stroke-width="1.3" rx="6"/>
<text x="805" y="72" class="call">План + высоты</text>
<text x="805" y="92" class="tiny">На плане — пятно (Ш×Г). Высота H — на v2</text>
<text x="805" y="108" class="tiny">и в подписях. ТТ: 460×780×H805 — пятно</text>
<text x="805" y="124" class="tiny">в масштабе комнаты (не уменьшен).</text>
<text x="805" y="148" class="call">Fe (90°)</text>
<text x="805" y="168" class="tiny">Зазор Ф1–Fe и Fe–Ф2 ≥160 мм.</text>
<text x="805" y="184" class="tiny">Ф1 → Fe → Ф2 по одной горизонтали:</text>
<text x="805" y="200" class="tiny">выход/вход в бок под 90° (без лесенки).</text>
<text x="805" y="224" class="call">Линии</text>

