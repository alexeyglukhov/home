     font-size="2.55"
     fill="#222"
     text-anchor="start"
     dominant-baseline="central"
     font-family="DejaVu Sans, Liberation Sans, sans-serif"
     id="text1419">Серая линия — неровный контур с карты, не параллелен рамке. Для границ брать красный контур.</text>
  <text
     x="40.00"
