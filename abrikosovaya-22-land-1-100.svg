     font-size="2.55"
     fill="#222"
     text-anchor="start"
     dominant-baseline="central"
     font-family="DejaVu Sans, Liberation Sans, sans-serif"
     id="text1415">Красный контур — участок. Стороны 50,83 · 34,09 · 52,39 · 27,68 м. Площадь по контуру 1544 м².</text>
  <text
     x="40.00"
     y="58.70"
     font-size="2.55"
     fill="#222"
     text-anchor="start"
     dominant-baseline="central"
     font-family="DejaVu Sans, Liberation Sans, sans-serif"
     id="text1417">Светло-зелёная рамка — отступы до соседних контуров: север 20 м, восток 6 м, юг 15 м, запад 15 м.</text>
  <text
     x="40.00"
